name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter this package supports (Dart 3.9, the newest SDK
        # analyzer 12.1 runs on) and whatever stable is today.
        flutter-version: ['3.35.2', '']
    name: test (Flutter ${{ matrix.flutter-version || 'latest stable' }})
    steps:
      - uses: actions/checkout@v5

      # The Flutter SDK (not just Dart) is needed: the rule tests analyze
      # test/fixtures/sample_app, a Flutter app.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}

      - run: dart pub get
      - run: flutter pub get
        working-directory: test/fixtures/sample_app

      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run
