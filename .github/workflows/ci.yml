name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter this package supports (3.35 / Dart 3.9) and
        # whatever stable is today.
        flutter-version: ['3.35.2', '']
    name: test (Flutter ${{ matrix.flutter-version || 'latest stable' }})
    steps:
      - uses: actions/checkout@v5

      # The Flutter SDK (not just Dart) is needed: the rule tests analyze
      # test/fixtures/sample_app, a Flutter app.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}

      - run: dart pub get
      - run: flutter pub get
        working-directory: test/fixtures/sample_app

      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

      # The way users install it: as a dev dependency of a Flutter app, whose
      # SDK pins versions (e.g. `meta`) that fluttr_scope's dependencies must
      # accept. Testing the package on its own never catches a clash there.
      - name: Install into a fresh Flutter app
        run: |
          flutter create --project-name ci_app "$RUNNER_TEMP/ci_app"
          cd "$RUNNER_TEMP/ci_app"
          flutter pub add --dev fluttr_scope --path "$GITHUB_WORKSPACE"
